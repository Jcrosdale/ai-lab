<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flashcards — Minimal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="app-grid">
  <header role="banner" class="site-header">
    <h1>Flashcards</h1>
  </header>

  <nav id="decks" class="sidebar" aria-label="Decks" role="navigation">
    <div class="sidebar-top">
      <button id="add-deck" class="btn primary">+ New Deck</button>
    </div>

    <ul class="deck-list" role="listbox" aria-label="Available decks" tabindex="0">
      <!-- Deck items rendered by app.js -->
    </ul>
  </nav>

  <main id="cards" class="main container" role="main" aria-live="polite" data-app-root>
    <!-- Card area rendered by app.js -->
  </main>

  <footer id="footer" class="site-footer" role="contentinfo">
    <small>© 2026 Flashcards App</small>
  </footer>
</body>
</html>
